name: CI - Quality Gates & Multi-Platform Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: TypeCheck & Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Compilation Check
        run: npm run typecheck

      - name: Execute Full GameKit Test Suite (74 tests)
        run: npm test

      - name: Run GameKit Ecosystem Doctor Check
        run: npm run gamekit doctor

      - name: Verify Expo SDK 58 Compatibility Matrix
        run: npm run gamekit compatibility

